AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'

Style/Documentation:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Metrics/AbcSize:
  Max: 35

Metrics/ClassLength:
  Max: 360

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/MethodLength:
  Max: 35

Metrics/ModuleLength:
  Max: 320

Metrics/ParameterLists:
  Max: 7

Metrics/PerceivedComplexity:
  Max: 12

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'
