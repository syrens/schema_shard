name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schema_shard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Install pg dependencies & bundle with PG_INTEGRATION=1
        env:
          PG_INTEGRATION: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
          bundle install

      - name: Run RSpec (unit + SQLite + PostgreSQL live integration)
        env:
          PG_INTEGRATION: '1'
          PG_HOST: 127.0.0.1
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: schema_shard_test
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Build gem
        run: gem build schema_shard.gemspec
